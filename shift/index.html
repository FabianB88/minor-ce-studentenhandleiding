<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIFT is verhuisd</title></head><body><p>SHIFT heeft een eigen adres. <a id="shift-link" href="https://fabianb88.github.io/shift/">Open SHIFT</a>.</p><script>const destination=new URL('https://fabianb88.github.io/shift/');destination.search=location.search;destination.hash=location.hash;document.querySelector('#shift-link').href=destination.href;const oldScope=new URL('./',location.href).href;(async()=>{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope===oldScope).map(r=>r.unregister()));}})().catch(()=>{}).finally(()=>location.replace(destination.href));</script></body></html>
